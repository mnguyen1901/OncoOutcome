<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OncoOutcome — Citation Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f4f6f9;
    --panel:     #ffffff;
    --ink:       #15212e;
    --ink-soft:  #4a5b6b;
    --ink-faint: #8595a4;
    --line:      #e3e8ee;
    --line-soft: #eef1f5;
    --accent:    #0b6bcb;
    --accent-weak:#e7f0fb;
    --grid:      #eceff3;
    --radius:    10px;
    --shadow:    0 1px 2px rgba(21,33,46,.04), 0 4px 16px rgba(21,33,46,.05);
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  /* ---------- Header ---------- */
  header.app-bar {
    display: flex;
    align-items: center;
    gap: 14px 18px;
    flex-wrap: wrap;
    padding: 10px 28px;
    min-height: 60px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand .mark {
    font-weight: 700; font-size: 18px; letter-spacing: -.02em; color: var(--ink);
  }
  .brand .mark b { color: var(--accent); }
  .brand .tag {
    font-size: 12px; color: var(--ink-faint); font-weight: 500;
    border-left: 1px solid var(--line); padding-left: 10px; letter-spacing: .01em;
  }
  .app-bar .spacer { flex: 1; min-width: 12px; }
  .meta-chip {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; white-space: nowrap;
  }

  /* segmented toggles */
  .strat-toggle, .outcome-toggle { display: inline-flex; align-items: center; gap: 10px; }
  .outcome-toggle { margin-left: auto; }
  .toggle-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-faint); font-weight: 600;
  }
  .seg {
    display: inline-flex; flex-wrap: wrap; gap: 3px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; padding: 3px;
  }
  .seg button {
    appearance: none; border: 0; cursor: pointer; font-family: var(--sans);
    font-size: 12.5px; font-weight: 500; color: var(--ink-soft);
    background: transparent; border-radius: 6px; padding: 6px 11px;
    white-space: nowrap; transition: background .14s, color .14s, box-shadow .14s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"], .seg button[aria-selected="true"] {
    background: var(--panel); color: var(--accent); font-weight: 600;
    box-shadow: 0 1px 2px rgba(21,33,46,.10);
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 1480px; margin: 0 auto; padding: 22px 28px 40px;
    display: grid;
    grid-template-columns: minmax(0,1fr) 384px;
    gap: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }

  /* ---------- Plot card ---------- */
  .plot-card { padding: 18px 20px 14px; min-width: 0; }
  .plot-head { display: flex; flex-direction: column; gap: 13px; margin-bottom: 6px; }
  .plot-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .plot-title { font-size: 16px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .plot-sub { font-size: 12.5px; color: var(--ink-faint); margin: 2px 0 0; }
  .head-controls { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 18px; width: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; flex: 1 1 100%; }
  .legend button {
    appearance: none; cursor: pointer; font-family: var(--sans);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 11.5px; font-weight: 500; color: var(--ink-soft);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 4px 10px 4px 8px; transition: all .14s;
  }
  .legend button .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .legend button[aria-pressed="false"] { opacity: .38; }
  .legend button:hover { border-color: var(--ink-faint); }

  .plot-wrap { position: relative; width: 100%; height: 480px; margin-top: 6px; }
  .plot-wrap svg { display: block; width: 100%; height: 100%; }
  .pt { cursor: pointer; transition: opacity .12s; }
  .pt.dim { opacity: .12 !important; }

  /* loading / error overlay */
  .plot-status {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; text-align: center; color: var(--ink-faint);
    font-size: 13.5px; padding: 24px; line-height: 1.5;
  }
  .plot-status.err { color: #b23a48; }

  /* tooltip */
  .tooltip {
    position: absolute; pointer-events: none; z-index: 10;
    background: #0e1c28; color: #fff; border-radius: 8px;
    padding: 9px 11px; font-size: 12px; line-height: 1.45;
    max-width: 250px; box-shadow: 0 6px 22px rgba(0,0,0,.28);
    opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s;
  }
  .tooltip.show { opacity: 1; transform: translateY(0); }
  .tooltip .tt-mod { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #aebfce; }
  .tooltip .tt-mod .dot { width: 7px; height: 7px; border-radius: 50%; }
  .tooltip .tt-title { font-weight: 500; margin: 4px 0 5px; color: #fff; }
  .tooltip .tt-vals { font-family: var(--mono); font-size: 11px; color: #cdd9e4; }

  /* ---------- Detail panel ---------- */
  .detail { padding: 0; display: flex; flex-direction: column; position: sticky; top: 82px; height: calc(100vh - 104px); min-height: 480px; }
  .detail-head {
    padding: 15px 18px 13px; border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .detail-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin: 0; font-weight: 600; }
  .detail-body { padding: 18px; overflow-y: auto; flex: 1; }

  .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; color: var(--ink-faint);
    gap: 12px; padding: 20px;
  }
  .empty svg { opacity: .5; }
  .empty p { margin: 0; font-size: 13.5px; max-width: 230px; }

  .ab-mod { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; color: var(--ink-soft); margin-bottom: 10px; }
  .ab-mod .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ab-title { font-size: 17px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 10px; text-wrap: pretty; }
  .ab-authors { font-size: 13px; color: var(--ink-soft); margin: 0 0 3px; }
  .ab-source { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; }
  .ab-source em { color: var(--ink); font-style: italic; }
  .ab-metrics { display: flex; gap: 8px; margin: 0 0 16px; flex-wrap: wrap; }
  .metric { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; flex: 1; min-width: 84px; }
  .metric .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
  .metric .v { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--ink); margin-top: 1px; }
  .ab-endpoint { font-size: 13.5px; color: var(--ink); margin: 0 0 16px; line-height: 1.4; }
  .ab-endpoint-k { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 600; margin-bottom: 3px; }
  .ab-abstract-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 600; margin: 0 0 6px; }
  .ab-abstract { font-size: 13.5px; color: var(--ink-soft); line-height: 1.62; margin: 0 0 18px; text-wrap: pretty; }
  .ab-pmid {
    display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    font-size: 13px; font-weight: 500; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; padding: 8px 13px;
    transition: background .14s;
  }
  .ab-pmid:hover { background: var(--accent-weak); }
  .ab-pmid .pmid-num { font-family: var(--mono); font-size: 12px; }

  /* ---------- References ---------- */
  .refs { grid-column: 1 / -1; padding: 20px 24px 22px; }
  .refs h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); margin: 0 0 14px; font-weight: 600; }
  .ref-list { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 36px; }
  @media (max-width: 1080px){ .ref-list { columns: 1; } }
  .ref-item {
    display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line-soft);
    break-inside: avoid; font-size: 12.5px; line-height: 1.45;
  }
  .ref-num { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: none; width: 22px; padding-top: 2px; }
  .ref-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; }
  .ref-body { min-width: 0; }
  .ref-title { color: var(--ink); font-weight: 500; }
  .ref-cite { color: var(--ink-faint); }
  .ref-cite a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 11.5px; }
  .ref-cite a:hover { text-decoration: underline; }

  @media (max-width: 920px){
    main { grid-template-columns: 1fr; }
    .detail { position: static; height: auto; min-height: 0; }
    .detail-body { max-height: 460px; }
  }
</style>
</head>
<body>
  <header class="app-bar">
    <div class="strat-toggle" role="group" aria-label="Risk stratification">
      <span class="toggle-label">Stratification</span>
      <div class="seg" id="tabs" role="tablist" aria-label="Risk cohorts"></div>
    </div>
    <div class="outcome-toggle" role="group" aria-label="Outcome measure">
      <span class="toggle-label">Outcome</span>
      <div class="seg" id="outcomeSeg"></div>
    </div>
  </header>

  <main>
    <section class="card plot-card" aria-label="Scatter plot">
      <div class="plot-head">
        <div class="plot-head-top">
          <div>
            <h1 class="plot-title" id="plotTitle">—</h1>
            <p class="plot-sub" id="plotSub">—</p>
          </div>
          <span class="meta-chip" id="metaChip">—</span>
        </div>
        <div class="head-controls">
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div class="plot-wrap" id="plotWrap">
        <svg id="plot" preserveAspectRatio="none" aria-label="Citation scatter plot"></svg>
        <div class="tooltip" id="tooltip"></div>
      </div>
    </section>

    <aside class="card detail" aria-label="Citation detail">
      <div class="detail-head">
        <h2>Article detail</h2>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </aside>

    <section class="card refs" aria-label="References">
      <h2 id="refsTitle">References</h2>
      <ol class="ref-list" id="refList"></ol>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
